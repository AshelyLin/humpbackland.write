  [[params.profileMode.buttons]]
    name = "文章"
    url = "/posts/"

  [[params.profileMode.buttons]]
    name = "關於我"
    url = "/about/"

[[params.socialIcons]]
  name = "github"
  url = "https://github.com/你的帳號"

[[params.socialIcons]]
  name = "email"
  url = "mailto:you@example.com"

