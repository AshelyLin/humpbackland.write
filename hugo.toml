baseURL = "https://humpbackland-write.pages.dev/"
locale = "zh-tw"
title = "鯨魚島"
theme = "PaperMod"

[outputs]
  home = ["HTML", "RSS", "JSON"]

[params]
  defaultTheme = "auto"      # 跟隨系統深淺色 light/dark
  ShowReadingTime = true
  ShowShareButtons = false

[params.fuseOpts]
  isCaseSensitive = false
  shouldSort = true
  location = 0
  distance = 1000
  threshold = 0.4
  minMatchCharLength = 0
  # limit = 10
  keys = ["title", "permalink", "summary", "content"]

# Home-Info Mode
[params.homeInfoParams]
  Title = "Hi there 👋"
  Content = "Can be Info, links, about..."

# 個人首頁模式：首頁改成置中的個人介紹頁
